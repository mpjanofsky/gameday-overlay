name: Bug report
description: Something looks wrong or doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please leave out local network addresses and Home Assistant tokens.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Kiosk Satellite version
      placeholder: "Echo Show 5, Kiosk Satellite 2026.10.20"
    validations:
      required: true
  - type: input
    id: team
    attributes:
      label: Team and league
      placeholder: "Tampa Bay Rowdies, USL Championship (usa.usl.1)"
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or status line
      description: A photo of the bar helps. The status line shows on the plugin's page in Kiosk Satellite.
